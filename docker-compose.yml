services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://lerniq:lerniq@db:5432/lerniq
      FRONTEND_URL: http://localhost:5174
      NODE_ENV: development
      JWT_SECRET: dev-jwt-secret-change-in-production
      ADMIN_PASSWORD: Admin@Lerniq2024!
      # Set ONE of these. LECTURER_SURVEY_SLUG takes priority over LECTURER_TYPEFORM_URL.
      LECTURER_SURVEY_SLUG: ""
      LECTURER_TYPEFORM_URL: ""
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lerniq
      POSTGRES_PASSWORD: lerniq
      POSTGRES_DB: lerniq
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lerniq"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5433:5432"   # 5432 is taken by your local Postgres; connect via localhost:5433

volumes:
  postgres_data:
